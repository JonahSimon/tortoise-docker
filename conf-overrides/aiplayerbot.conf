# Local pins for the TortoiseBots module (canonical core). Applied over aiplayerbot.conf by
# render-config.sh on every start. The Shyalya-era file is aiplayerbot.conf.bak-shyalya-2026-09-30.

# Pool: the 500 old RNDBOT accounts (4500 characters) were adopted at the console on 2026-10-01
# (`bot pool adopt preview` / `confirm <challenge>`), so Autologin brings 1000 of them online.
# AutoCreate stays 0: the adopted pool already holds far more characters than MaxRandomBots.
AiPlayerbot.RandomBotAutologin = 1
# Without this the pool stays offline until something asks for bots; the old server logged them in at boot.
AiPlayerbot.RandomBotLoginAtStartup = 1
AiPlayerbot.RandomBotAutoCreate = 0

# Chat: Jonah halved the broadcast and reply chances (TortoiseBots defaults 3000/3000/2000/100).
AiPlayerbot.BroadcastToWorldGlobalChance = 1500
AiPlayerbot.BroadcastToGeneralGlobalChance = 1500
AiPlayerbot.BroadcastChanceSuggestSomething = 1000
AiPlayerbot.GuildRepliesRate = 50

# Bot reaction delay 200 ms (default 100).
AiPlayerbot.ReactDelay = 200

# Activity: bots near a real player or in a group stay fully active, the rest rotate at 10 %.
# (No equivalent of the old 2000 yd ActiveNearPlayerRange or F2 travel-party critical flag exists.)
AiPlayerbot.DisableActivityPriorities = 0
AiPlayerbot.ForceActiveWhenNearPlayer = 1

# Auction house: bots trade their own inventory, plus synthetic supply and a synthetic buyer
# (the old AhBot.Enabled = 1 behaviour).
AiPlayerbot.AhMarketEnabled = 1
AiPlayerbot.AhMarketSyntheticSupply = 1
AiPlayerbot.AhMarketBuyer = 1

# World PvP (our TortoiseBots fork, custom/main). Force-flag every random bot so players can attack
# them anywhere; a share of bots also start fights with flagged enemies.
# Same as the Shyalya-era live server (2026-09-29): 10 % of bots seek, real players only, so on this
# RP realm they only go after Jonah once he types /pvp. Verified at seek 2 / 100 % on 2026-10-01.
AiPlayerbot.RandomBotForcePvp = 1
AiPlayerbot.WorldPvpSeek = 1
AiPlayerbot.WorldPvpSeekBotPercent = 10
AiPlayerbot.AllowedLogFiles = bot_events.csv,deaths.csv,pvp_seek.csv

# Travel parties (our TortoiseBots fork, runtime/TravelPartyService). Same values as the Shyalya-era
# live server: up to 10 parties, one attempt a minute, 70 % muster at the nearest friendly town,
# 10 % head for a raid door, march to the door and disband (no entering). Log: F2_travel.log in
# /opt/turtle/bin.
AiPlayerbot.TravelParties = 1
AiPlayerbot.TravelPartySpawnInterval = 60
AiPlayerbot.TravelPartyMaxConcurrent = 10
AiPlayerbot.TravelPartyClosestTownPct = 70
AiPlayerbot.TravelPartyRaidPct = 10
