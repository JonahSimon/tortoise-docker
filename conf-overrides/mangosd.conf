# Pinned by Jonah 2026-09-30 when the Shyalya-final image changed these defaults.
# Comment lines are ignored; "Key = Value" lines override the rendered mangosd.conf.

# Upstream default is 15 min; a crash would lose that much progress.
PlayerSave.Interval = 60000
# Upstream default is 100 / 170; F1 gathers bots around the player, keep them in view.
Visibility.Distance.Continents = 250
Visibility.Distance.Instances = 250

# 2026-10-26: no automatic 15-min restart for honor maintenance. With it on, every boot after a
# week+ idle (the normal on-demand case) schedules a shutdown, and TortoiseBots logs no bots in
# while a shutdown is pending. Off = the core logs it and runs the rank calc on the next boot.
AutoHonorRestart = 0
